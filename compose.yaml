services:
  app:
    build:
      context: .
      args:
        SOURCE_REPOSITORY: ${SOURCE_REPOSITORY:-https://github.com/gaato/offkai-manager}
        VCS_REF: ${VCS_REF:-development}
    ports:
      - '8080:8080'
    environment:
      OFFKAI_HTTP_ADDR: 0.0.0.0:8080
      OFFKAI_HTTP_SHUTDOWN_TIMEOUT: ${OFFKAI_HTTP_SHUTDOWN_TIMEOUT:-10s}
      OFFKAI_CLIENT_IP_HEADER: ${OFFKAI_CLIENT_IP_HEADER:-}
      OFFKAI_TIMEZONE: ${OFFKAI_TIMEZONE:-Asia/Tokyo}
      OFFKAI_LOG_LEVEL: ${OFFKAI_LOG_LEVEL:-info}
      OFFKAI_DATABASE_PATH: /data/offkai.sqlite
      OFFKAI_DB_MIGRATE: 'true'
      OFFKAI_PUBLIC_BASE_URL: ${OFFKAI_PUBLIC_BASE_URL:-http://127.0.0.1:8080}
      # Local Compose defaults only. Production must disable the bypass and replace the secret.
      OFFKAI_SESSION_SECRET: ${OFFKAI_SESSION_SECRET:-compose-development-session-secret}
      OFFKAI_AUTH_DEV_BYPASS: ${OFFKAI_AUTH_DEV_BYPASS:-true}
      OFFKAI_DISCORD_CLIENT_ID: ${OFFKAI_DISCORD_CLIENT_ID:-}
      OFFKAI_DISCORD_CLIENT_SECRET: ${OFFKAI_DISCORD_CLIENT_SECRET:-}
      OFFKAI_DISCORD_REDIRECT_URL: ${OFFKAI_DISCORD_REDIRECT_URL:-}
      OFFKAI_DISCORD_BOT_TOKEN: ${OFFKAI_DISCORD_BOT_TOKEN:-}
      OFFKAI_STRIPE_SECRET_KEY: ${OFFKAI_STRIPE_SECRET_KEY:-}
      OFFKAI_STRIPE_WEBHOOK_SECRET: ${OFFKAI_STRIPE_WEBHOOK_SECRET:-}
      OFFKAI_PLATFORM_ADMIN_DISCORD_IDS: ${OFFKAI_PLATFORM_ADMIN_DISCORD_IDS:-}
      OFFKAI_WORKER_ENABLED: ${OFFKAI_WORKER_ENABLED:-true}
    volumes:
      - offkai-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  offkai-data:
